<div class="container">
  <h2>Trigger Schedules</h2>

  <div class="batch-row" *ngFor="let batch of batches">

    <button
      (click)="triggerBatch(batch.type, batch.recipientType, batch.username, batch.date)"
      [disabled]="loading">
      Trigger {{ batch.label }} Batch
    </button>

    <select [(ngModel)]="batch.recipientType">
      <option value="ALL">All Users</option>
      <option value="SPECIFIC">Specific</option>
    </select>

    <app-admin-username-autocomplete
      [value]="batch.username"
      (valueChange)="batch.username = $event"
      [disabled]="batch.recipientType !== 'SPECIFIC'"
      placeholder="Enter username"
    />

    <!-- Date picker -->
    <!-- Date picker -->
<input
  type="date"
  [(ngModel)]="batch.date"
  [disabled]="batch.type !== 'INCOME'"
  aria-label="Batch execution date"
/>

  </div>

  <p class="message" *ngIf="message">
    {{ message }}
  </p>
</div>
